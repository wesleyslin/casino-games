<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --felt: #1a6b3c;
    --felt-dark: #0d4a25;
    --felt-light: #2d8f52;
    --gold: #d4a843;
    --gold-light: #f0d68a;
    --gold-dark: #b8922e;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --glass-hover: rgba(255,255,255,0.1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #fff;
    overflow: hidden;
    height: 100vh; width: 100vw;
    user-select: none;
    -webkit-user-select: none;
}

#lobby-bg {
    position: fixed; inset: 0;
    background:
        radial-gradient(ellipse at 50% 40%, var(--felt-light) 0%, var(--felt) 40%, var(--felt-dark) 80%, #1a0a0a 100%);
    overflow: hidden;
}

.sparkle {
    position: absolute; width: 3px; height: 3px;
    background: radial-gradient(circle, rgba(212,168,67,0.6), transparent);
    border-radius: 50%; pointer-events: none;
    animation: sparkle-float var(--dur) ease-in-out infinite;
    animation-delay: var(--delay); opacity: 0;
}
@keyframes sparkle-float {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
    50% { opacity: 0.35; transform: translateY(-14px) scale(1); }
}

#lobby {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(16px, 3vh, 32px);
    z-index: 10;
}

.lobby-logo {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: clamp(48px, 8vw, 80px); font-weight: 900;
    letter-spacing: clamp(6px, 1vw, 14px);
    background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    animation: logo-in 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes logo-in {
    0% { opacity: 0; transform: scale(0.8) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

.lobby-sub {
    color: rgba(255,255,255,0.35);
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 4px; text-transform: uppercase;
    font-weight: 500;
    animation: fade-up 0.6s 0.2s both;
}

.game-grid {
    display: flex;
    gap: clamp(16px, 3vw, 32px);
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px;
    animation: fade-up 0.6s 0.35s both;
}
@keyframes fade-up {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
}

.game-card {
    width: clamp(220px, 28vw, 300px);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: clamp(28px, 4vh, 44px) clamp(20px, 3vw, 32px);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
    display: flex; flex-direction: column;
    align-items: center; gap: clamp(10px, 1.5vh, 16px);
    text-decoration: none; color: inherit;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative; overflow: hidden;
}
.game-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 40%);
    pointer-events: none;
    border-radius: inherit;
}
.game-card:hover {
    background: var(--glass-hover);
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-6px);
    box-shadow:
        0 16px 48px rgba(0,0,0,0.4),
        0 0 40px rgba(212,168,67,0.08);
}
.game-card:active {
    transform: translateY(-2px) scale(0.98);
}

.game-icon {
    font-size: clamp(40px, 6vw, 56px);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
}
.game-title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: clamp(20px, 2.8vw, 28px); font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.game-desc {
    font-size: clamp(11px, 1.2vw, 14px);
    color: rgba(255,255,255,0.4);
    line-height: 1.5;
}
.game-tag {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    padding: 3px 10px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    margin-top: 4px;
}

.lobby-footer {
    position: fixed;
    bottom: clamp(14px, 2vh, 24px);
    color: rgba(255,255,255,0.15);
    font-size: 11px;
    letter-spacing: 1px;
    animation: fade-up 0.6s 0.5s both;
}

@media (max-width: 520px) {
    .game-grid { flex-direction: column; align-items: center; }
    .game-card { width: 85vw; max-width: 320px; }
}
</style>
</head>
<body>

<div id="lobby-bg"></div>

<div id="lobby">
    <div class="lobby-logo">CASINO</div>
    <div class="lobby-sub">Select Your Game</div>
    <div class="game-grid">
        <a href="blackjack.html" class="game-card">
            <span class="game-icon">&#x1f0cf;</span>
            <span class="game-title">Blackjack</span>
            <span class="game-desc">Beat the dealer. Get closest to 21 without going over.</span>
            <span class="game-tag">1-4 Players</span>
        </a>
        <a href="baccarat.html" class="game-card">
            <span class="game-icon">&#x1f3b4;</span>
            <span class="game-title">Baccarat</span>
            <span class="game-desc">Bet on Player or Banker. Closest to 9 wins.</span>
            <span class="game-tag">1-4 Players</span>
        </a>
    </div>
</div>

<div class="lobby-footer">Built with cards &amp; code</div>

<script>
// Sparkles
const bg = document.getElementById('lobby-bg');
for (let i = 0; i < 24; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--dur', (4 + Math.random() * 5) + 's');
    s.style.setProperty('--delay', (Math.random() * 6) + 's');
    bg.appendChild(s);
}
</script>
</body>
</html>
